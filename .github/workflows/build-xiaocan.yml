name: Build Xiaocan tweak

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'xiaocan/**'
      - '.github/workflows/build-xiaocan.yml'
  push:
    branches: [main]
    paths:
      - 'xiaocan/**'
      - '.github/workflows/build-xiaocan.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package Xiaocan (roothide)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test native launch memory policy
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror xiaocan/tests/native_skip_policy.c -o /tmp/native-skip-policy
          /tmp/native-skip-policy

      - name: Test home promotion policy and registry
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror xiaocan/tests/home_promotion_policy.c -o /tmp/home-promotion-policy
          /tmp/home-promotion-policy
          clang++ -x c++ -std=c++17 -Wall -Wextra -Werror xiaocan/tests/home_promotion_policy.c -o /tmp/home-promotion-policy-cpp
          /tmp/home-promotion-policy-cpp
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation xiaocan/tests/home_promotion_registry.m -o /tmp/home-promotion-registry
          /tmp/home-promotion-registry

      - name: Install packaging tools
        run: |
          set -euo pipefail
          for formula in dpkg ldid make libplist; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Prepare pinned RootHide Theos
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" submodule update --init --recursive
          git -C "$THEOS" rev-parse HEAD

      - name: Install Theos SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          rm -rf xiaocan/packages
          make -C xiaocan clean
          make -C xiaocan package messages=yes 2>&1 | tee xiaocan/build.log
          ls -l xiaocan/packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: xiaocan-adfree-roothide
          path: xiaocan/packages/*.deb
          if-no-files-found: error
