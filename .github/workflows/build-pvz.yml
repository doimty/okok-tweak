name: Build PvZ tweak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pvz/**'
      - '.github/workflows/build-pvz.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package PvZ (roothide)
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          for formula in dpkg ldid make libplist; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done

      - name: Prepare pinned RootHide Theos
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/roothide/theos.git "$THEOS"
          git -C "$THEOS" fetch --depth 1 origin 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" checkout --detach 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          git -C "$THEOS" submodule update --init --recursive
          git -C "$THEOS" rev-parse HEAD

      - name: Install Theos SDK (iPhoneOS16.5)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          rm -rf pvz/packages
          make -C pvz clean
          make -C pvz package messages=yes 2>&1 | tee pvz/build.log
          ls -l pvz/packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: pvz-adfree-roothide
          path: pvz/packages/*.deb
          if-no-files-found: error
